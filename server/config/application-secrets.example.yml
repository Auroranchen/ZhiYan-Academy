# 智枢学堂 · 本地密钥模板
# 复制为 application-secrets.yml 后填写真实值；application-secrets.yml 已在 .gitignore 中，禁止提交。
# 也可以完全不使用本文件，改用环境变量注入（推荐生产环境）。

# 数据库密码（dev profile 的 ${DB_PASSWORD}；生产还可配 DB_HOST/DB_PORT/DB_NAME/DB_USERNAME）
DB_PASSWORD:

ai:
  # DeepSeek（OpenAI 兼容接口）。也可用环境变量 AI_API_URL / AI_API_KEY / AI_MODEL 覆盖。
  zhipu:
    api-key:
    model: deepseek-chat
  # 科大讯飞语音听写
  xfyun:
    app-id:
    api-key:
    api-secret:
  # 科大讯飞语音合成
  xfyun-tts:
    app-id:
    api-key:
    api-secret:

# 邮件通知（可选）。QQ 邮箱填 SMTP 授权码，不是登录密码。
spring:
  mail:
    username:
    password:

# 微信小程序（可选）。AppSecret 禁止写入源码或提交到仓库。
wechat:
  mini-program:
    app-id:
    app-secret:
    # 可选：仅在服务器无法直连 api.weixin.qq.com 时填写本机 HTTP 代理。
    proxy-host:
    proxy-port: 0

app:
  notify:
    mail:
      enabled: false
      to:
  # Actuator 健康检查等端点的访问令牌（非本地访问时需要）
  actuator:
    token:
  # RAG 向量化：provider=local 时无需 Key；provider=zhipu 时填智谱 embedding-3 Key
  rag:
    embedding:
      provider: local
      api-key:
      model: embedding-3
      dim: 1024
