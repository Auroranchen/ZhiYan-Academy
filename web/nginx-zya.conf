# 智枢学堂 Nginx 站点配置参考（宝塔可粘贴到站点配置文件中对应位置）
# 站点根目录指向前端 dist；后端 jar 监听 8082
#
# 本次更新必须包含的关键点：
#   1. /agent/pipeline/stream SSE 需要 proxy_buffering off + 长超时（600s），否则流水线中途被掐断
#   2. WebSocket（签到/通知）需要 Upgrade 头
#   3. history 路由回退 index.html

server {
    listen 80;
    # listen 443 ssl;  # 按站点实际 HTTPS 配置
    server_name zhykt.lqh2002.com;

    # 前端静态资源（dist 解压目录）
    root /www/wwwroot/zhykt/dist;
    index index.html;

    # Vue history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri /index.html;
    }

    # Iconify 图标 API 反向代理
    # 前端以相对路径 /api-iconify 请求图标（src/main.js 的 addAPIProvider），
    # dev 由 vue.config.js 代理。缺少本 location 时请求会回退到 index.html，
    # 图标全部渲染不出来。^~ 保证优先于下方的静态资源正则。
    location ^~ /api-iconify/ {
        proxy_pass https://api.iconify.design/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.iconify.design;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 后端 API 反向代理
    location /ZhiYanAcademy/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：$proxy_add_x_forwarded_for 会把客户端自带的 XFF 保留在最左侧，
        # 后端据此限流时可被伪造绕过。此处只有一个受信代理，直接用 $remote_addr。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（课堂签到 / 站内通知实时推送）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # AI 长任务与 SSE 流式（多智能体流水线可能持续数分钟）
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;

        client_max_body_size 60m;
    }
}
