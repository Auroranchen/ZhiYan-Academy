<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Student Learning Illustration -->

  <!-- Laptop -->
  <rect x="100" y="160" width="140" height="90" rx="6" fill="#e2e8f0"/>
  <rect x="106" y="166" width="128" height="72" rx="3" fill="#0f172a" opacity="0.9"/>
  <!-- Screen content -->
  <rect x="116" y="176" width="50" height="6" rx="2" fill="#0ea5e9" opacity="0.8"/>
  <rect x="116" y="188" width="108" height="4" rx="2" fill="#475569" opacity="0.4"/>
  <rect x="116" y="196" width="95" height="4" rx="2" fill="#475569" opacity="0.3"/>
  <rect x="116" y="204" width="100" height="4" rx="2" fill="#475569" opacity="0.3"/>
  <rect x="116" y="216" width="40" height="12" rx="4" fill="#14b8a6" opacity="0.8"/>
  <!-- Laptop base -->
  <path d="M80 250 L90 250 Q100 250 100 250 L240 250 Q240 250 250 250 L260 250 L255 260 Q253 264 248 264 L92 264 Q87 264 85 260 Z" fill="#cbd5e1"/>

  <!-- Student figure (sitting) -->
  <!-- Head -->
  <circle cx="250" cy="110" r="24" fill="#fef3c7"/>
  <!-- Hair -->
  <path d="M226 105 Q228 85 250 80 Q272 85 274 105" fill="#0f172a" opacity="0.7"/>
  <!-- Glasses -->
  <circle cx="242" cy="112" r="7" fill="none" stroke="#475569" stroke-width="1.5"/>
  <circle cx="258" cy="112" r="7" fill="none" stroke="#475569" stroke-width="1.5"/>
  <line x1="249" y1="112" x2="251" y2="112" stroke="#475569" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="242" cy="113" r="2" fill="#0f172a"/>
  <circle cx="258" cy="113" r="2" fill="#0f172a"/>
  <!-- Smile -->
  <path d="M245 122 Q250 126 255 122" stroke="#0f172a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <path d="M232 134 Q250 140 268 134 L272 180 Q250 185 228 180 Z" fill="#0ea5e9"/>
  <!-- Arm reaching to laptop -->
  <path d="M232 145 Q210 170 220 190 Q222 195 228 192 L240 175" fill="#0ea5e9" opacity="0.85"/>
  <!-- Other arm -->
  <path d="M268 145 Q280 165 275 185 Q274 190 268 188 L262 170" fill="#0ea5e9" opacity="0.85"/>

  <!-- Floating knowledge elements -->
  <!-- Light bulb -->
  <circle cx="310" cy="70" r="14" fill="#f59e0b" opacity="0.2"/>
  <circle cx="310" cy="70" r="10" fill="#f59e0b" opacity="0.3"/>
  <path d="M305 80 L315 80 M306 83 L314 83" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Checkmark badge -->
  <circle cx="80" cy="130" r="16" fill="#22c55e" opacity="0.15"/>
  <path d="M72 130 L78 136 L90 124" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Book icon floating -->
  <rect x="320" y="140" width="24" height="18" rx="2" fill="#14b8a6" opacity="0.25"/>
  <line x1="332" y1="143" x2="332" y2="155" stroke="#14b8a6" stroke-width="1" opacity="0.4"/>

  <!-- Decorative dots -->
  <circle cx="60" cy="80" r="4" fill="#0ea5e9" opacity="0.2"/>
  <circle cx="350" cy="200" r="5" fill="#14b8a6" opacity="0.2"/>
  <circle cx="50" cy="200" r="3" fill="#f59e0b" opacity="0.2"/>
  <circle cx="340" cy="100" r="3" fill="#0ea5e9" opacity="0.15"/>
</svg>
